- severity: minor
  file: analysis/random-stimuli-ideation/reports/.reviewer-copy.html
  line: "473, 489, 506, 526, 482-484"
  section: framing
  summary: The examples come first, as the author asked, but no caption says how each call was chosen, and one example is generalized without a hedge.
  evidence: |
    <caption>One call with a poem the model was required to use. ...</caption>
    ...
    <em>required</em> each idea to draw on it, the titles changed but the experiments did not
  why_it_matters: The examples orient the reader well, but each one could be a typical call or the clearest one. "The titles changed but the experiments did not" is stated about the required-poem arm from one call, before any aggregate supports it.
  suggested_fix: Add "chosen at random" or "chosen as typical, by [rule]" to each example caption, and write "in this call, the titles changed but the experiments did not".
  confidence: medium

- severity: minor
  file: analysis/random-stimuli-ideation/reports/.reviewer-copy.html
  line: "463-535"
  section: framing
  summary: The examples never show either named baseline (verbalized sampling, personas) as concrete ideas.
  evidence: |
    Before any averages, here is what the ideas look like.
  why_it_matters: The headline compares the instruction against verbalized sampling, and personas are the lab's current tool, yet the reader meets both only as numbers. One verbalized-sampling call would show why it scores zero distinct useful-novel ideas.
  suggested_fix: Add a short verbalized-sampling example (two or three rows) next to the plain-prompt table, or one sentence describing what its ideas look like.
