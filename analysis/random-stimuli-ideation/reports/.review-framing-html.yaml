- severity: minor
  file: analysis/random-stimuli-ideation/reports/.reviewer-copy.html
  line: "390-391, 425-428"
  section: framing
  summary: The headline count rests on a threshold of at least four on both scales, and neither the threshold's sensitivity nor how small the counts are is visible where the headline is stated.
  evidence: |
    worked best: <span ...>6</span> distinct
    useful-novel ideas, against <span ...>0</span> for the plain prompt
  why_it_matters: The plain prompt's mean novelty is 2.09, so a zero is close to built into a novelty-at-least-four cutoff. Six versus zero distinct groups, out of forty ideas each, is a small count that could shift with the cutoff. A sweep is reported for the clustering threshold but not for the quality cutoff.
  suggested_fix: In the abstract give the denominator ("out of forty ideas"), and in the supplement report the counts at a cutoff of 3.5 or 4.5.
  confidence: medium

- severity: minor
  file: analysis/random-stimuli-ideation/reports/.reviewer-copy.html
  line: "2493"
  section: framing
  summary: The scatter-plot caption states a general tradeoff and a "best balance" judgment as if read off the figure.
  evidence: |
    Prompts that push novelty pay for it in usefulness; the instruction-only prompt gives the best balance.
  why_it_matters: The tradeoff is a pattern across nineteen arm means under one judge, and "best balance" is a judgment. A skim reader takes the caption as a general law.
  suggested_fix: Rewrite as "Across these prompt types, higher judged novelty went with lower judged usefulness; the instruction-only prompt had the most distinct ideas clearing both cutoffs."
  confidence: low

- severity: minor
  file: analysis/random-stimuli-ideation/reports/.reviewer-copy.html
  line: "437, 2498-2499, 544-545, 2601"
  section: framing
  summary: Elegant variation. The prompt condition is called "arm", "prompt type", "approach" and "lever", and the clustering unit is called "distinct idea groups", "groups" and "clusters".
  evidence: |
    We ran nineteen prompt types (we call each one an <em>arm</em>)
    <h3>Every approach converges on the same few ideas or analogies</h3>
    Each lever that added variety moved the repetition up a level rather than removing it.
  why_it_matters: A reader at Tier B has to work out that these terms name the same thing. "Lever" is also a metaphor in a report about removing metaphors.
  suggested_fix: Use "prompt type" (or "arm") everywhere and "idea groups" everywhere, and replace "Each lever that added variety" with "Each prompt type that added variety".
  confidence: medium

- severity: minor
  file: analysis/random-stimuli-ideation/reports/.reviewer-copy.html
  line: "2058-2061"
  section: framing
  summary: The parallel-problem paragraph says the arm "produced fewer" distinct ideas and then says the difference cannot be told from chance.
  evidence: |
    so the arm produced fewer distinct
    useful-novel ideas than the instruction alone:
    <span ...>4</span> against <span ...>6</span>, a difference the data cannot
    distinguish from chance (Holm-adjusted p ... = 0.514).
  why_it_matters: The "so" implies that the lower usefulness caused fewer distinct ideas, and then the next clause says there is no detectable difference. The reader gets two signals in one sentence.
  suggested_fix: Rewrite as "it had 4 distinct useful-novel ideas against 6 for the instruction alone, a difference within chance (p = 0.514)."
  confidence: low

- severity: minor
  file: analysis/random-stimuli-ideation/reports/.reviewer-copy.html
  line: "2659-2663"
  section: framing
  summary: Changelog framing in the supplement. The text describes a past pipeline state and the fix.
  evidence: |
    That stop happened before the pipeline recorded blocked batches, so resuming the run
    re-sent the same, unmodified batch, which then completed. No ratings are missing. Blocked batches
    are now recorded and excluded, never retried.
  why_it_matters: "Are now recorded" tells the reader about a pipeline change, not about this dataset. Only the consequence matters here: one batch was re-sent unmodified and all ratings are present.
  suggested_fix: Rewrite as "One judge batch was stopped by a safety classifier (very likely a false positive) and re-sent unmodified; it completed and no ratings are missing."
  confidence: low
