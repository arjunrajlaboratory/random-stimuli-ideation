# Phase 6: blind numerical re-verify (HTML). Reviewer read <main> of .reviewer-copy.html only.
# Checked: label next to all 48 value/text spans against the manifest and source JSON/CSV; all 5
# worked-example tables row by row against outputs/report_examples.csv and
# outputs/distinct_useful_novel_clusters_stripped.csv (all match exactly; aggregate 13 -> 6 matches);
# figure and arm_table sha256 (all match); code-grounding of the useful-novel and distinct definitions,
# stripping, judge protocol, Holm families, permutation count and quoted prompt wordings; example
# claims ("permanent labeling" absent from plain: confirmed; hysteresis 8/8, immune 6/8,
# magnetism 8/8, lighthouse 6/8: confirmed); provenance list (all writing scripts present).
# Confirmed against code: cutoff >= 4 on pass-averaged scores (05:L76, config:L135); dedup on
# stripped MiniLM embeddings at 0.75, average linkage (05:L88-100, common:L77-87); judge batches of
# 20, 2 passes, opaque I1..In labels, all arms shuffled together (04:L67-79, config:L131-132);
# N_PERMUTATIONS = 5000 and p floor 1/5001 (config:L123, 05:L122); Holm frozen per phase (config:L62-69).

