    evidence: |
      14. One model judge produced every quality score, so ratings by scientists are still needed.
    why_it_matters: >-
      The caveat correctly gets its own slide. The second clause is a next step
      that could sit with slide 15.
    suggested_fix: >-
      Keep one point, e.g. "Every quality score came from a single model judge,
      not from scientists."
    confidence: low
